---
name: Test Go
on:
  workflow_call:
    inputs:
      aqua_policy_config:
        required: false
        type: string
      aqua_policy_allow:
        required: false
        type: string
      aqua_version:
        required: true
        type: string
      go-version:
        required: false
        type: string
      go-version-file:
        required: false
        type: string
      golangci-lint-timeout:
        required: false
        type: string
      gomodule_artifact_name:
        # The name of the artifact created by suzuki-shunsuke/download-go-module-action in the caller workflow.
        # If this is set, the gomodule job is skipped and the artifact is used instead,
        # so the caller can share the artifact with other jobs such as integration tests.
        # The artifact must include go-licenses (aqua_packages: go-licenses).
        required: false
        type: string
    secrets:
      TAKUMI_GUARD_BOT_ID:
        required: false

permissions: {}

env:
  AQUA_POLICY_CONFIG: ${{inputs.aqua_policy_config}}
  AQUA_LOG_COLOR: always

jobs:
  gomodule:
    # Download Go modules through Takumi Guard, which requires id-token: write.
    # The test job runs code controlled by the caller (e.g. GoReleaser hooks),
    # so it must not have id-token: write.
    # Go modules and go-licenses are passed to the test job via an artifact.
    # Skipped if the caller passes its own artifact via gomodule_artifact_name.
    if: inputs.gomodule_artifact_name == ''
    uses: suzuki-shunsuke/download-go-module-action/.github/workflows/download.yaml@e03acd0c9d3d230019ebb7bd4a62507431fe4316 # v0.0.10
    permissions:
      contents: read
      id-token: write
    with:
      go-version-file: ${{inputs.go-version-file || 'go.mod'}}
      aqua_version: ${{inputs.aqua_version}}
      aqua_packages: go-licenses
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}

  # lint and test run in separate jobs so that go test doesn't have pull-requests: write.
  # go test runs code of the repository and its dependencies (tests, init functions, and so on),
  # while only reviewdog in the lint job needs pull-requests: write.
  # Don't merge them into one job.
  lint:
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    needs: gomodule
    # Run even if the gomodule job is skipped because gomodule_artifact_name is set
    if: |
      !cancelled() && (needs.gomodule.result == 'success' || needs.gomodule.result == 'skipped')
    permissions:
      pull-requests: write # To update pull requests by reviewdog
      contents: read # To checkout private repository
    env:
      # Use only the modules downloaded in the gomodule job.
      # Fail instead of silently downloading modules without Takumi Guard.
      GOPROXY: "off"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go and restore Go modules
        uses: $/actions/setup
        with:
          aqua_version: ${{inputs.aqua_version}}
          go-version: ${{inputs.go-version}}
          go-version-file: ${{inputs.go-version-file}}
          artifact_name: ${{inputs.gomodule_artifact_name || 'gomodule'}}

      - name: List installed packages
        id: pkgs
        run: |
          pkgs=golangci-lint
          if [ -f .goreleaser.yml ] || [ -f .goreleaser.yaml ]; then
            pkgs="$pkgs goreleaser"
          fi
          echo "value=$pkgs" >> "$GITHUB_OUTPUT"

      - name: Install tools
        uses: $/actions/install
        with:
          aqua_version: ${{inputs.aqua_version}}
          packages: ${{steps.pkgs.outputs.value}}

      - name: Validate GoReleaser configuration
        run: |
          if [ -f .goreleaser.yml ] || [ -f .goreleaser.yaml ]; then
            goreleaser check
          fi

      - name: Validate Go license
        run: go-licenses check --disallowed_types=forbidden,restricted,unknown ./...

      - name: golangci-lint
        uses: suzuki-shunsuke/github-action-golangci-lint@9ec42b6334deb9b6e0a92372eba2dfbb333062e1 # v0.1.5
        if: |
          github.event_name != 'pull_request' || ! github.event.pull_request.head.repo.fork
        with:
          timeout: ${{inputs.golangci-lint-timeout}}

      - name: golangci-lint (pull_request from fork)
        run: |
          if [ -n "$INPUT_TIMEOUT" ]; then
            golangci-lint run --timeout "$INPUT_TIMEOUT"
          else
            golangci-lint run
          fi
        if: |
          github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
        env:
          INPUT_TIMEOUT: ${{inputs.golangci-lint-timeout}}

  test:
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    needs: gomodule
    # Run even if the gomodule job is skipped because gomodule_artifact_name is set
    if: |
      !cancelled() && (needs.gomodule.result == 'success' || needs.gomodule.result == 'skipped')
    permissions:
      contents: read # To checkout private repository
    env:
      # Use only the modules downloaded in the gomodule job.
      # Fail instead of silently downloading modules without Takumi Guard.
      GOPROXY: "off"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go and restore Go modules
        uses: $/actions/setup
        with:
          aqua_version: ${{inputs.aqua_version}}
          go-version: ${{inputs.go-version}}
          go-version-file: ${{inputs.go-version-file}}
          artifact_name: ${{inputs.gomodule_artifact_name || 'gomodule'}}

      - name: go test
        run: go test -v ./... -race -covermode=atomic
