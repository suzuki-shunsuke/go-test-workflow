---
name: Test Go
on:
  workflow_call:
    inputs:
      aqua_policy_config:
        required: false
        type: string
      aqua_policy_allow:
        required: false
        type: string
      aqua_version:
        required: true
        type: string
      go-version:
        required: false
        type: string
      go-version-file:
        required: false
        type: string
      golangci-lint-timeout:
        required: false
        type: string
    secrets:
      TAKUMI_GUARD_BOT_ID:
        required: false

permissions: {}

env:
  AQUA_POLICY_CONFIG: ${{inputs.aqua_policy_config}}
  AQUA_LOG_COLOR: always

jobs:
  gomodule:
    # Download Go modules through Takumi Guard, which requires id-token: write.
    # The build job runs code controlled by the caller (e.g. GoReleaser hooks),
    # so it must not have id-token: write.
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate inputs go-version and go-version-file
        if: inputs.go-version == '' && inputs.go-version-file == ''
        run: |
          echo "::error:: Either go-version or go-version-file must be set."
          exit 1

      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{inputs.go-version}}
          go-version-file: ${{inputs.go-version-file}}
          cache: false

      - name: Set up Takumi Guard
        uses: flatt-security/setup-takumi-guard-golang@2e3c7c40b538cd68b2ac483def12982ebc8bc02e # v1
        with:
          bot-id: ${{secrets.TAKUMI_GUARD_BOT_ID}}

      - name: Install go-licenses
        uses: $/actions/install
        with:
          aqua_version: ${{inputs.aqua_version}}
          packages: |
            go-licenses

      - name: Download Go modules
        run: go mod download all

      - name: Archive Go modules and go-install packages (go-licenses)
        run: |
          mkdir -p "$RUNNER_TEMP/gomodule"
          tar -C "$(go env GOMODCACHE)" -czf "$RUNNER_TEMP/gomodule/gomodcache.tar.gz" cache/download
          tar -C "$(aqua root-dir)" -czf "$RUNNER_TEMP/gomodule/go_install.tar.gz" pkgs/go_install

      # Pass the modules and binaries via an artifact instead of actions/cache.
      # Artifacts are scoped to this workflow run, so they can't be poisoned by other workflows.
      # Files are archived with tar because artifacts don't preserve file permissions.
      - name: Upload Go modules and go-install packages (go-licenses)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gomodule
          path: ${{ runner.temp }}/gomodule
          retention-days: 1

  test:
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    needs: gomodule
    permissions:
      pull-requests: write # To update pull requests by reviewdog
      contents: read # To checkout private repository
    env:
      # Use only the modules downloaded in the gomodule job.
      # Fail instead of silently downloading modules without Takumi Guard.
      GOPROXY: "off"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{inputs.go-version}}
          go-version-file: ${{inputs.go-version-file}}
          cache: true

      - name: Download Go modules and go-install packages (go-licenses)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gomodule
          path: ${{ runner.temp }}/gomodule

      - name: Extract Go modules
        run: |
          gomodcache=$(go env GOMODCACHE)
          mkdir -p "$gomodcache"
          tar -C "$gomodcache" -xzf "$RUNNER_TEMP/gomodule/gomodcache.tar.gz"

      - name: List installed packages
        id: pkgs
        run: |
          pkgs=golangci-lint
          if [ -f .goreleaser.yml ] || [ -f .goreleaser.yaml ]; then
            pkgs="$pkgs goreleaser"
          fi
          echo "value=$pkgs" >> "$GITHUB_OUTPUT"

      - name: Install tools
        uses: $/actions/install
        with:
          aqua_version: ${{inputs.aqua_version}}
          packages: ${{steps.pkgs.outputs.value}}

      - name: Extract Go install packages (go-licenses)
        run: |
          root_dir=$(aqua root-dir)
          mkdir -p "$root_dir"
          tar -C "$root_dir" -xzf "$RUNNER_TEMP/gomodule/go_install.tar.gz"

      - name: Validate GoReleaser configuration
        run: |
          if [ -f .goreleaser.yml ] || [ -f .goreleaser.yaml ]; then
            goreleaser check
          fi

      - name: Validate Go license
        run: go-licenses check --disallowed_types=forbidden,restricted,unknown ./...

      - name: golangci-lint
        uses: suzuki-shunsuke/github-action-golangci-lint@9ec42b6334deb9b6e0a92372eba2dfbb333062e1 # v0.1.5
        if: |
          github.event_name != 'pull_request' || ! github.event.pull_request.head.repo.fork
        with:
          timeout: ${{inputs.golangci-lint-timeout}}

      - name: golangci-lint (pull_request from fork)
        run: |
          if [ -n "$INPUT_TIMEOUT" ]; then
            golangci-lint run --timeout "$INPUT_TIMEOUT"
          else
            golangci-lint run
          fi
        if: |
          github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
        env:
          INPUT_TIMEOUT: ${{inputs.golangci-lint-timeout}}

      - name: go test
        run: go test -v ./... -race -covermode=atomic
