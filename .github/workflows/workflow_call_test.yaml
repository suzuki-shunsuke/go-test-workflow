---
name: test (workflow_call)
permissions: {}
on:
  workflow_call:
    secrets:
      TAKUMI_GUARD_BOT_ID:
        required: false
jobs:
  test:
    uses: suzuki-shunsuke/test-workflow/.github/workflows/test.yaml@51ece8dcaabff59820bfb2053c56e3cb281cf7b2 # v0.0.1
    with:
      aqua_version: v2.64.0
    permissions:
      pull-requests: read
      contents: read

  go:
    uses: $/.github/workflows/test.yaml
    with:
      aqua_version: v2.64.0
      go-version-file: go.mod
    permissions:
      pull-requests: write
      contents: read # To checkout private repository
      id-token: write

  # Test gomodule_artifact_name
  gomodule:
    uses: suzuki-shunsuke/download-go-module-action/.github/workflows/download.yaml@dc4640ee5d5a7bea22008b5eac92a560ce90f1fb # v0.0.7
    permissions:
      contents: read
      id-token: write
    with:
      aqua_version: v2.64.0
      aqua_packages: go-licenses
      # Avoid a conflict with the artifact of the go job
      artifact_name: gomodule-shared
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}

  go-shared-gomodule:
    needs: [gomodule]
    uses: $/.github/workflows/test.yaml
    with:
      aqua_version: v2.64.0
      go-version-file: go.mod
      gomodule_artifact_name: gomodule-shared
    permissions:
      pull-requests: write
      contents: read # To checkout private repository
      id-token: write
